name: SonarQube Cloud

on:
  push:
    branches: [ main, SonarQubeSettings ]
  pull_request:
    types: [ opened, synchronize, reopened ]

permissions:
  contents: read
  pull-requests: read

jobs:
  sonar:
    name: Build y análisis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Compilar backend
        working-directory: backend
        run: mvn -B -DskipTests verify

      - name: Instalar dependencias del frontend
        working-directory: frontend
        run: npm ci --ignore-scripts

      - name: Comprobar frontend
        run: |
          ls
          find . -name "*.ts" -not -path "*/node_modules/*" | head -20

      - name: Cache de Sonar
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Análisis SonarQube Cloud
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: -Dsonar.verbose=true